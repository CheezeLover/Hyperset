<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

<defs>
  <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
  </marker>
  <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#93C5FD"/>
  </marker>
</defs>

<!-- Background -->
<rect width="880" height="560" fill="#F8FAFC"/>

<!-- Title -->
<text x="440" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Hyperset Architecture</text>
<text x="440" y="47" text-anchor="middle" font-size="12" fill="#64748B">Stateless application layer · Stateful data layer</text>

<!-- Browser -->
<rect x="360" y="62" width="160" height="42" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="440" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Browser / Client</text>
<text x="440" y="95" text-anchor="middle" font-size="10" fill="#94A3B8">HTTPS · port 80 / 443</text>

<!-- Arrow: Browser → Caddy -->
<line x1="440" y1="104" x2="440" y2="119" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- ═══════════════════════ STATELESS BOX ═══════════════════════ -->
<rect x="20" y="120" width="840" height="220" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<!-- Header background (top-rounded only) -->
<rect x="20" y="120" width="840" height="30" rx="10" fill="#3B82F6"/>
<rect x="20" y="136" width="840" height="14" fill="#3B82F6"/>
<text x="42" y="140" font-size="11" font-weight="700" fill="white" letter-spacing="1.5">STATELESS</text>
<text x="440" y="140" text-anchor="middle" font-size="10" fill="#BFDBFE">podman-compose.yml  ·  restart or replace any container without data loss</text>

<!-- Caddy -->
<rect x="300" y="162" width="280" height="52" rx="7" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
<text x="440" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">Caddy</text>
<text x="440" y="198" text-anchor="middle" font-size="10" fill="#475569">Reverse proxy · TLS · JWT auth · SSO header injection</text>
<text x="440" y="210" text-anchor="middle" font-size="9" fill="#94A3B8">Only container with host ports (:80, :443)</text>

<!-- Arrows: Caddy → services (fan out) -->
<line x1="330" y1="214" x2="150" y2="244" stroke="#93C5FD" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="400" y1="214" x2="327" y2="244" stroke="#93C5FD" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="480" y1="214" x2="522" y2="244" stroke="#93C5FD" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="550" y1="214" x2="730" y2="244" stroke="#93C5FD" stroke-width="1.5" marker-end="url(#ab)"/>

<!-- ── Service boxes ── -->
<!-- Portal -->
<rect x="40" y="244" width="185" height="76" rx="6" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
<text x="132" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Portal</text>
<text x="132" y="278" text-anchor="middle" font-size="10" fill="#475569">Next.js · :3000</text>
<text x="132" y="291" text-anchor="middle" font-size="9" fill="#64748B">Chat · Admin · Knowledge base</text>
<text x="132" y="307" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">No local state</text>

<!-- Superset -->
<rect x="235" y="244" width="185" height="76" rx="6" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
<text x="327" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Superset</text>
<text x="327" y="278" text-anchor="middle" font-size="10" fill="#475569">App · Worker · Beat (:8088)</text>
<text x="327" y="291" text-anchor="middle" font-size="9" fill="#64748B">Analytics · Dashboards</text>
<text x="327" y="307" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">No local state</text>

<!-- Superset MCP -->
<rect x="430" y="244" width="185" height="76" rx="6" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
<text x="522" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Superset MCP</text>
<text x="522" y="278" text-anchor="middle" font-size="10" fill="#475569">LLM tool bridge · :8000</text>
<text x="522" y="291" text-anchor="middle" font-size="9" fill="#64748B">AI chart lifecycle</text>
<text x="522" y="307" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">No local state</text>

<!-- Pages Service -->
<rect x="625" y="244" width="215" height="76" rx="6" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
<text x="732" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Pages Service</text>
<text x="732" y="278" text-anchor="middle" font-size="10" fill="#475569">Static content · :8001</text>
<text x="732" y="291" text-anchor="middle" font-size="9" fill="#64748B">Custom pages &amp; backends</text>
<text x="732" y="307" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">No local state</text>

<!-- ═══════════════════════ ARROWS between layers ═══════════════════════ -->
<line x1="132" y1="320" x2="132" y2="358" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<line x1="327" y1="320" x2="327" y2="358" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<line x1="522" y1="320" x2="522" y2="358" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<line x1="732" y1="320" x2="732" y2="358" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>

<!-- ═══════════════════════ STATEFUL BOX ═══════════════════════ -->
<rect x="20" y="360" width="840" height="172" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<!-- Header background (top-rounded only) -->
<rect x="20" y="360" width="840" height="30" rx="10" fill="#D97706"/>
<rect x="20" y="376" width="840" height="14" fill="#D97706"/>
<text x="42" y="380" font-size="11" font-weight="700" fill="white" letter-spacing="1.5">STATEFUL</text>
<text x="440" y="380" text-anchor="middle" font-size="10" fill="#FEF3C7">podman-compose.data.yml  ·  single source of truth  ·  data survives any container restart</text>

<!-- ── Data store boxes ── -->
<!-- portal-db -->
<rect x="40" y="400" width="185" height="94" rx="6" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
<text x="132" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">portal-db</text>
<text x="132" y="435" text-anchor="middle" font-size="10" fill="#475569">PostgreSQL 15</text>
<text x="132" y="448" text-anchor="middle" font-size="9" fill="#64748B">Admin · KB · page config</text>
<text x="132" y="461" text-anchor="middle" font-size="9" fill="#D97706" font-style="italic">portal_db_data</text>
<line x1="58" y1="469" x2="207" y2="469" stroke="#FEF3C7" stroke-width="1"/>
<text x="132" y="483" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">→ Managed DB</text>

<!-- superset-db -->
<rect x="235" y="400" width="185" height="94" rx="6" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
<text x="327" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">superset-db</text>
<text x="327" y="435" text-anchor="middle" font-size="10" fill="#475569">PostgreSQL 15</text>
<text x="327" y="448" text-anchor="middle" font-size="9" fill="#64748B">Superset metadata</text>
<text x="327" y="461" text-anchor="middle" font-size="9" fill="#D97706" font-style="italic">superset_db_data</text>
<line x1="253" y1="469" x2="402" y2="469" stroke="#FEF3C7" stroke-width="1"/>
<text x="327" y="483" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">→ Managed DB</text>

<!-- superset-redis -->
<rect x="430" y="400" width="185" height="94" rx="6" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
<text x="522" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">superset-redis</text>
<text x="522" y="435" text-anchor="middle" font-size="10" fill="#475569">Redis 7</text>
<text x="522" y="448" text-anchor="middle" font-size="9" fill="#64748B">Cache · Celery broker</text>
<text x="522" y="461" text-anchor="middle" font-size="9" fill="#D97706" font-style="italic">superset_redis_data</text>
<line x1="448" y1="469" x2="597" y2="469" stroke="#FEF3C7" stroke-width="1"/>
<text x="522" y="483" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">→ Managed Redis</text>

<!-- hyperset_data volume -->
<rect x="625" y="400" width="215" height="94" rx="6" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
<text x="732" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">hyperset_data</text>
<text x="732" y="435" text-anchor="middle" font-size="10" fill="#475569">/pages · /superset-home</text>
<text x="732" y="448" text-anchor="middle" font-size="9" fill="#64748B">/caddy-data · /caddy-config</text>
<text x="732" y="461" text-anchor="middle" font-size="9" fill="#D97706" font-style="italic">Files · TLS certs · Beat schedule</text>
<line x1="643" y1="469" x2="822" y2="469" stroke="#FEF3C7" stroke-width="1"/>
<text x="732" y="483" text-anchor="middle" font-size="9" font-weight="600" fill="#16A34A">→ S3 / Blob Storage</text>

<!-- Caption -->
<text x="440" y="548" text-anchor="middle" font-size="11" fill="#94A3B8" font-style="italic">Restart or rebuild any service in the application layer — no data is lost because no data lives there</text>

</svg>
