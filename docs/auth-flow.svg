<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
  </marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1000" height="268" fill="#F8FAFC"/>

<!-- Title -->
<text x="500" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Authentication Flow — JWT Verification &amp; Header Injection</text>

<!-- ── Browser box (x=30, y=62, w=150, h=88, center_y=106) ── -->
<rect x="30" y="62" width="150" height="88" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="105" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Browser</text>
<text x="105" y="106" text-anchor="middle" font-size="10" fill="#94A3B8">User session</text>
<text x="105" y="121" text-anchor="middle" font-size="10" fill="#94A3B8">auth cookie</text>

<!-- Arrow: Browser → Caddy -->
<line x1="180" y1="106" x2="252" y2="106" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="216" y="98" text-anchor="middle" font-size="9.5" fill="#64748B">HTTPS</text>

<!-- ── Caddy box (x=254, y=46, w=250, h=120, center_y=106) ── -->
<rect x="254" y="46" width="250" height="120" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="379" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">Caddy</text>
<text x="379" y="90" text-anchor="middle" font-size="10.5" fill="#475569">Verifies JWT / auth cookie</text>
<text x="379" y="107" text-anchor="middle" font-size="10.5" fill="#475569">Extracts user identity</text>
<line x1="274" y1="116" x2="484" y2="116" stroke="#BFDBFE" stroke-width="1"/>
<text x="379" y="131" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3B82F6">Injects identity headers on every upstream request</text>
<text x="379" y="147" text-anchor="middle" font-size="9.5" fill="#64748B">X-Token-User-*  ·  X-Webauth-*</text>

<!-- ── Upper arrow: Caddy → Portal/Services ── -->
<!-- From right edge of Caddy (x=504) to left edge of Portal box (x=636) -->
<!-- Angled upward: start (504, 86), end (634, 72) -->
<line x1="504" y1="86" x2="634" y2="72" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="562" y="65" text-anchor="middle" font-size="9" fill="#3B82F6" font-weight="600">X-Token-User-Id</text>
<text x="562" y="78" text-anchor="middle" font-size="9" fill="#3B82F6">X-Token-User-Email · X-Token-User-Roles</text>

<!-- ── Lower arrow: Caddy → Superset ── -->
<!-- Angled downward: start (504, 126), end (634, 152) -->
<line x1="504" y1="126" x2="634" y2="152" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
<text x="562" y="148" text-anchor="middle" font-size="9" fill="#D97706" font-weight="600">X-Webauth-User</text>
<text x="562" y="161" text-anchor="middle" font-size="9" fill="#D97706">X-Webauth-Email · X-Webauth-Groups</text>

<!-- ── Portal / Services box (x=636, y=40, w=210, h=72) ── -->
<rect x="636" y="40" width="210" height="72" rx="8" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
<text x="741" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Portal · Pages · MCP</text>
<text x="741" y="81" text-anchor="middle" font-size="10" fill="#475569">Reads X-Token-User-*</text>
<text x="741" y="97" text-anchor="middle" font-size="10" fill="#64748B">for identity &amp; role checks</text>

<!-- ── Superset box (x=636, y=130, w=210, h=72) ── -->
<rect x="636" y="130" width="210" height="72" rx="8" fill="white" stroke="#D97706" stroke-width="1.5"/>
<text x="741" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Superset</text>
<text x="741" y="171" text-anchor="middle" font-size="10" fill="#475569">AUTH_REMOTE_USER mode</text>
<text x="741" y="187" text-anchor="middle" font-size="10" fill="#64748B">trusts X-Webauth-User</text>

<!-- ── Security note ── -->
<rect x="30" y="222" width="940" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
<text x="500" y="237" text-anchor="middle" font-size="10" fill="#7F1D1D">
  <tspan font-weight="700" fill="#DC2626">⚠ Security rule: </tspan>
  <tspan>Superset trusts X-Webauth-User unconditionally — it must never be directly internet-accessible.</tspan>
</text>
<text x="500" y="252" text-anchor="middle" font-size="9.5" fill="#9CA3AF">Access only through Caddy at https://superset.{domain} — direct port :8088 access bypasses all authentication.</text>

</svg>
