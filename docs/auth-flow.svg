<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
  </marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
  </marker>
</defs>

<!-- Background -->
<rect width="880" height="210" fill="#F8FAFC"/>

<!-- Title -->
<text x="440" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Authentication Flow — JWT Verification &amp; Header Injection</text>

<!-- Browser box -->
<rect x="30" y="60" width="130" height="76" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="95" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Browser</text>
<text x="95" y="101" text-anchor="middle" font-size="10" fill="#94A3B8">User session</text>
<text x="95" y="116" text-anchor="middle" font-size="10" fill="#94A3B8">auth cookie</text>
<text x="95" y="131" text-anchor="middle" font-size="9" fill="#CBD5E1">──────────</text>

<!-- Arrow: Browser → Caddy -->
<line x1="160" y1="98" x2="220" y2="98" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="190" y="91" text-anchor="middle" font-size="9" fill="#64748B">HTTPS</text>

<!-- Caddy box -->
<rect x="222" y="44" width="220" height="108" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="332" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">Caddy</text>
<text x="332" y="84" text-anchor="middle" font-size="10" fill="#475569">Verifies JWT / auth cookie</text>
<text x="332" y="99" text-anchor="middle" font-size="10" fill="#475569">Extracts user identity</text>
<line x1="242" y1="108" x2="422" y2="108" stroke="#BFDBFE" stroke-width="1"/>
<text x="332" y="122" text-anchor="middle" font-size="9" font-weight="600" fill="#3B82F6">Injects headers on every upstream request</text>
<text x="332" y="137" text-anchor="middle" font-size="9" fill="#64748B">X-Token-User-*  ·  X-Webauth-*</text>

<!-- Upper arrow → Portal/Services -->
<line x1="442" y1="80" x2="520" y2="72" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="476" y="66" text-anchor="middle" font-size="9" fill="#3B82F6">X-Token-User-Id</text>
<text x="476" y="77" text-anchor="middle" font-size="9" fill="#3B82F6">X-Token-User-Email</text>

<!-- Lower arrow → Superset -->
<line x1="442" y1="120" x2="520" y2="136" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
<text x="476" y="134" text-anchor="middle" font-size="9" fill="#D97706">X-Webauth-User</text>
<text x="476" y="145" text-anchor="middle" font-size="9" fill="#D97706">X-Webauth-Groups</text>

<!-- Portal / Services box -->
<rect x="522" y="40" width="180" height="64" rx="8" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
<text x="612" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Portal · Pages · MCP</text>
<text x="612" y="76" text-anchor="middle" font-size="10" fill="#475569">Reads X-Token-User-*</text>
<text x="612" y="91" text-anchor="middle" font-size="10" fill="#64748B">for identity &amp; role checks</text>

<!-- Superset box -->
<rect x="522" y="116" width="180" height="64" rx="8" fill="white" stroke="#D97706" stroke-width="1.5"/>
<text x="612" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Superset</text>
<text x="612" y="152" text-anchor="middle" font-size="10" fill="#475569">AUTH_REMOTE_USER mode</text>
<text x="612" y="167" text-anchor="middle" font-size="10" fill="#64748B">trusts X-Webauth-User</text>

<!-- Security note -->
<rect x="30" y="168" width="820" height="30" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
<text x="440" y="181" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">⚠ Security rule:</text>
<text x="530" y="181" text-anchor="start" font-size="10" fill="#7F1D1D">Superset trusts X-Webauth-User unconditionally — it must never be internet-accessible directly.</text>
<text x="440" y="193" text-anchor="middle" font-size="9.5" fill="#9CA3AF">Access only through Caddy at https://superset.{domain} — direct port :8088 access bypasses all authentication.</text>

</svg>
