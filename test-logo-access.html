<!DOCTYPE html>
<html>
<head>
    <title>Logo Test</title>
</head>
<body>
    <h1>Logo Accessibility Test</h1>
    
    <h2>1. Direct from public folder (should work):</h2>
    <img src="/logo_hyperset.png" alt="Logo" style="max-width: 200px; border: 1px solid #ccc;">
    <p>Path: <code>/logo_hyperset.png</code></p>
    
    <h2>2. Via Caddy /logos/ path (needs Caddy running):</h2>
    <img src="/logos/logo_hyperset.png" alt="Logo" style="max-width: 200px; border: 1px solid #ccc;">
    <p>Path: <code>/logos/logo_hyperset.png</code></p>
    
    <h2>3. Check browser console for 404 errors</h2>
    <p>Open browser DevTools (F12) → Console tab</p>
</body>
</html>
