<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat – Hyperset</title>
<style>
:root {
  --md-surface:         #f5f3f0;
  --md-surface-cont:    #ffffff;
  --md-surface-cont-hi: #eceae7;
  --md-on-surface:      #1c1b1f;
  --md-outline:         #cac5be;
  --md-outline-var:     #ddd8d2;
  --md-primary:         #20a7c9;
  --md-primary-muted:   #4dbdd6;
  --md-primary-cont:    #e0f4f8;
  --md-on-primary-cont: #0c6a82;
  --radius-m: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --md-surface:         #1a1a1e;
    --md-surface-cont:    #242428;
    --md-surface-cont-hi: #2e2e33;
    --md-on-surface:      #e4e1e6;
    --md-outline:         #49474e;
    --md-outline-var:     #3a383f;
    --md-primary:         #5cc8e4;
    --md-primary-muted:   #3aafcc;
    --md-primary-cont:    #0c3d4a;
    --md-on-primary-cont: #a0e4f4;
  }
  html { color-scheme: dark; }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--md-surface);
  color: var(--md-on-surface);
  -webkit-font-smoothing: antialiased;
}
#root {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--md-surface-cont);
}

/* ── Header ── */
#header {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--md-outline-var);
  gap: 8px;
  min-height: 44px;
  flex-shrink: 0;
}
#header-title { font-size: 13px; font-weight: 600; color: var(--md-on-surface); flex: 1; }
.icon-btn {
  width: 28px; height: 28px;
  border: none; border-radius: var(--radius-m);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--md-surface-cont-hi);
  color: var(--md-on-surface);
  opacity: 0.55;
  flex-shrink: 0;
}
.icon-btn:hover { opacity: 0.85; }

/* ── Banners ── */
#banner {
  display: none;
  margin: 8px 10px 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(211,47,47,0.10);
  border: 1px solid rgba(211,47,47,0.28);
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
}
#banner-text { flex: 1; line-height: 1.5; }
#banner-dismiss { border: none; background: none; cursor: pointer; color: var(--md-on-surface); opacity: 0.4; font-size: 15px; padding: 0 2px; line-height: 1; }
#mcp-warning {
  display: none;
  margin: 6px 10px 0;
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(245,158,11,0.10);
  border: 1px solid rgba(245,158,11,0.30);
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
#mcp-warning-text { flex: 1; opacity: 0.75; line-height: 1.4; }
#mcp-dismiss { border: none; background: none; cursor: pointer; color: var(--md-on-surface); opacity: 0.4; font-size: 14px; padding: 0 2px; line-height: 1; }

/* ── Messages ── */
#messages { flex: 1; overflow-y: auto; padding: 12px 0; }
#empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 10px;
  opacity: 0.45;
  user-select: none;
  font-size: 13px;
  pointer-events: none;
}
.msg { display: flex; flex-direction: column; padding: 2px 12px; }
.msg.user { align-items: flex-end; }
.msg.assistant { align-items: flex-start; }
.msg-bubble {
  max-width: 88%;
  padding: 8px 12px;
  border-radius: 14px;
  background: var(--md-primary-cont);
  color: var(--md-on-primary-cont);
  font-size: 13px;
  line-height: 1.55;
  word-break: break-word;
}
.msg.assistant .msg-bubble {
  padding: 6px 0;
  border-radius: 0;
  background: transparent;
  color: var(--md-on-surface);
  max-width: 92%;
}
.cursor {
  display: inline-block;
  width: 6px; height: 13px;
  background: var(--md-primary);
  border-radius: 1px;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
}

/* ── Tool zone ── */
.tool-zone {
  max-width: 88%;
  border: 1px solid var(--md-primary-cont);
  border-radius: 10px;
  margin-bottom: 6px;
  overflow: hidden;
}
.tool-zone-header {
  width: 100%; display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: var(--md-primary-cont);
  border: none; cursor: pointer;
  color: var(--md-on-primary-cont);
  font-size: 12px; font-weight: 500; text-align: left;
  font-family: inherit;
}
.tool-zone-body {
  padding: 5px 6px 6px;
  background: var(--md-surface);
  display: flex; flex-direction: column; gap: 3px;
}
.tool-step { border: 1px solid var(--md-outline-var); border-radius: 8px; overflow: hidden; background: var(--md-surface-cont); }
.tool-step-header {
  width: 100%; display: flex; align-items: center; gap: 6px;
  padding: 5px 9px;
  background: transparent; border: none; cursor: pointer;
  color: var(--md-on-surface); font-size: 11px; font-weight: 500;
  text-align: left; opacity: 0.85; font-family: inherit;
}
.tool-step-body {
  padding: 7px 11px; font-size: 10.5px;
  overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  color: var(--md-on-surface); opacity: 0.75;
  border-top: 1px solid var(--md-outline-var);
}
.spinner {
  width: 9px; height: 9px;
  border: 1.5px solid currentColor; border-top-color: transparent;
  border-radius: 50%; display: inline-block;
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}

/* ── Follow-up suggestions ── */
.followup { margin-top: 12px; padding-left: 16px; border-left: 2px solid var(--md-primary); max-width: 88%; }
.followup-label { font-size: 12px; color: var(--md-primary); margin-bottom: 8px; font-weight: 500; }
.followup-btn {
  display: flex; align-items: center;
  padding: 6px 0;
  background: transparent; color: var(--md-on-surface);
  border: none; border-radius: 0;
  font-size: 13px; cursor: pointer; text-align: left;
  width: fit-content; max-width: 100%;
  transition: color 0.2s, transform 0.2s;
  font-family: inherit;
}
.followup-btn:hover { color: var(--md-primary); transform: translateX(2px); }
.followup-arrow { margin-right: 8px; opacity: 0.6; color: var(--md-primary); }

/* ── Input area ── */
#input-area { padding: 6px 10px 10px 14px; flex-shrink: 0; }
#input-wrap {
  position: relative;
  border-radius: 24px;
  border: 1px solid var(--md-outline-var);
  transition: border-color 0.2s;
}
#input-wrap.has-text { border-color: var(--md-primary); }
#input {
  width: 100%; resize: none; border: none;
  border-radius: 24px;
  padding: 6px 46px 6px 14px;
  font-size: 14px; background: transparent; color: var(--md-on-surface);
  outline: none; font-family: inherit; line-height: 24px;
  overflow-y: hidden; min-height: 38px;
  -webkit-appearance: none; appearance: none; display: block;
}
#send-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; cursor: pointer; padding: 4px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}

/* ── Markdown ── */
.md p { margin: 2px 0; line-height: 1.6; }
.md ul, .md ol { margin: 4px 0 4px 16px; padding: 0; }
.md pre {
  background: var(--md-surface-cont-hi); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; font-size: 12px;
  margin: 6px 0; border: 1px solid var(--md-outline-var);
}
.md code.ic {
  background: var(--md-surface-cont-hi); border-radius: 4px;
  padding: 1px 5px; font-size: 0.9em; font-family: monospace;
  border: 1px solid var(--md-outline-var);
}
.md a { color: var(--md-primary); }
.md hr { border: none; border-top: 1px solid var(--md-outline-var); margin: 10px 0; }
.md .sp { height: 6px; }
.md h1 { font-weight: 700; font-size: 1.1em; margin: 8px 0 4px; }
.md h2 { font-weight: 700; font-size: 1.05em; margin: 8px 0 4px; }
.md h3 { font-weight: 700; font-size: 1em; margin: 8px 0 4px; }
.md .tbl-wrap { overflow-x: auto; margin: 8px 0; }
.md table { border-collapse: collapse; width: 100%; font-size: 12px; border: 1px solid var(--md-outline-var); }
.md th { padding: 6px 10px; border: 1px solid var(--md-outline-var); font-weight: 600; background: var(--md-surface-cont-hi); }
.md td { padding: 6px 10px; border: 1px solid var(--md-outline-var); }
.md tr:nth-child(even) td { background: var(--md-surface-cont-hi); }
.md details { margin: 10px 0; border-radius: 8px; border: 1px solid var(--md-outline-var); background: var(--md-surface-cont); overflow: hidden; }
.md summary { cursor: pointer; font-weight: 500; padding: 8px 12px; user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
.md .ie { margin: 12px 0; }
.md .ie a { font-size: 11px; font-weight: 500; color: var(--md-primary); display: block; margin-bottom: 4px; }
.md .ie-frame { border: 1px solid var(--md-outline-var); border-radius: 8px; overflow: hidden; background: var(--md-surface-cont); }
.md .ie iframe { width: 100%; height: 300px; border: none; display: block; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--md-primary-muted); }
* { scrollbar-width: thin; scrollbar-color: var(--md-outline) transparent; }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="root">
  <!-- Header -->
  <div id="header">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--md-primary)">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
    </svg>
    <span id="header-title">Chat</span>
    <button id="clear-btn" class="icon-btn" title="Clear conversation" style="display:none" onclick="clearChat()">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
        <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/>
      </svg>
    </button>
  </div>

  <!-- Error banner -->
  <div id="banner">
    <span style="color:#ef5350;font-weight:700;flex-shrink:0;font-size:14px">⚠</span>
    <span id="banner-text"></span>
    <button id="banner-dismiss" onclick="hideBanner()">×</button>
  </div>

  <!-- MCP warning -->
  <div id="mcp-warning">
    <span style="color:#f59e0b;font-weight:700;flex-shrink:0">⚡</span>
    <span id="mcp-warning-text"></span>
    <button id="mcp-dismiss" onclick="document.getElementById('mcp-warning').style.display='none'">×</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div id="empty-state">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="var(--md-primary)">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
      </svg>
      <span>Hello! Ask me anything about your data.</span>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="input" placeholder="Ask about your data…" rows="1"
        oninput="onInput(this)" onkeydown="onKeyDown(event)"></textarea>
      <button id="send-btn" onclick="onSendOrStop()" title="Send">
        <svg id="send-icon" viewBox="0 0 24 24" width="20" height="20" fill="var(--md-primary)" style="opacity:0.3">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" transform="rotate(-45 12 12)"/>
        </svg>
        <svg id="stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="#ef5350" style="display:none">
          <path d="M18 18H6V6h12v12z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────
let msgs = [];        // {id, role, content, toolCalls, streaming, followup}
let loading = false;
let abortCtrl = null;
let streamId = null;  // id of current streaming assistant message

// ── Utilities ────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const esc = s => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// ── Markdown: inline ─────────────────────────────────────────────
function renderInline(text) {
  let out = '', rem = text;
  while (rem.length > 0) {
    const bi = rem.indexOf('**');
    const ci = rem.indexOf('`');
    const li = rem.indexOf('[');
    // italic: lone * not part of **
    let ii = -1;
    for (let k = 0; k < rem.length; k++) {
      if (rem[k] === '*' && rem[k+1] !== '*' && (k === 0 || rem[k-1] !== '*')) { ii = k; break; }
    }
    const min = Math.min(
      bi >= 0 ? bi : Infinity,
      ii >= 0 ? ii : Infinity,
      ci >= 0 ? ci : Infinity,
      li >= 0 ? li : Infinity
    );
    if (min === Infinity) { out += esc(rem); break; }
    if (min > 0) { out += esc(rem.slice(0, min)); rem = rem.slice(min); continue; }

    if (rem.startsWith('**')) {
      const e = rem.indexOf('**', 2);
      if (e !== -1) { out += `<strong>${esc(rem.slice(2, e))}</strong>`; rem = rem.slice(e + 2); continue; }
    }
    if (rem.startsWith('*') && !rem.startsWith('**')) {
      const e = rem.indexOf('*', 1);
      if (e !== -1) { out += `<em>${esc(rem.slice(1, e))}</em>`; rem = rem.slice(e + 1); continue; }
    }
    if (rem.startsWith('`')) {
      const e = rem.indexOf('`', 1);
      if (e !== -1) { out += `<code class="ic">${esc(rem.slice(1, e))}</code>`; rem = rem.slice(e + 1); continue; }
    }
    if (rem.startsWith('[')) {
      const m = rem.match(/^\[([^\]]*)\]\(([^)\s]+)\)/);
      if (m) {
        const href = m[2];
        out += /^https?:\/\//.test(href)
          ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(m[1])}</a>`
          : esc(m[0]);
        rem = rem.slice(m[0].length); continue;
      }
    }
    out += esc(rem[0]); rem = rem.slice(1);
  }
  return out;
}

// ── Markdown: table parser ────────────────────────────────────────
function parseTable(lines) {
  if (lines.length < 2) return null;
  const h0 = lines[0].trim();
  if (!h0.startsWith('|') || !h0.endsWith('|')) return null;
  const headers = h0.split('|').slice(1, -1).map(c => c.trim());
  if (!headers.length) return null;
  const aligns = lines[1].trim().split('|').slice(1, -1).map(p => {
    const t = p.trim();
    return (t.startsWith(':') && t.endsWith(':')) ? 'center' : t.endsWith(':') ? 'right' : 'left';
  });
  while (aligns.length < headers.length) aligns.push('left');
  const rows = [];
  for (let i = 2; i < lines.length; i++) {
    let cl = lines[i].trim();
    if (!cl.includes('|')) continue;
    if (!cl.startsWith('|')) cl = '|' + cl;
    if (!cl.endsWith('|')) cl += '|';
    const cells = cl.split('|').slice(1, -1).map(c => c.trim());
    if (cells.length === headers.length) rows.push(cells);
  }
  return { headers, aligns, rows };
}

// ── Markdown: block ───────────────────────────────────────────────
function renderMd(text) {
  // Pre-process [iframe] lines
  const src = text
    .replace(/```[^\n]*\n((?:\[iframe(?:-ai:\d+)?\][^\n]*\n?)+)```/g, (_, m) => m.trimEnd())
    .replace(/([^\n])(\[iframe(?:-ai:\d+)?\]\([^\s)]+\)[^\n]*)/g, (_, b, f) => `${b}\n${f}`)
    .replace(/^[ \t]+(\[iframe(?:-ai:\d+)?\])/gm, '$1');

  const lines = src.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // Code block
    if (line.startsWith('```')) {
      const lang = esc(line.slice(3).trim());
      const code = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) { code.push(lines[i]); i++; }
      i++;
      html += `<pre><code${lang ? ` data-lang="${lang}"` : ''}>${esc(code.join('\n'))}</code></pre>`;
      continue;
    }

    // Bullet list
    if (/^[-*] /.test(line)) {
      html += '<ul>';
      while (i < lines.length && /^[-*] /.test(lines[i])) {
        html += `<li>${renderInline(lines[i].slice(2))}</li>`; i++;
      }
      html += '</ul>'; continue;
    }

    // Numbered list
    if (/^\d+\. /.test(line)) {
      html += '<ol>';
      while (i < lines.length && /^\d+\. /.test(lines[i])) {
        html += `<li>${renderInline(lines[i].replace(/^\d+\. /, ''))}</li>`; i++;
      }
      html += '</ol>'; continue;
    }

    // Table
    if (line.includes('|') && !line.startsWith('    ') && !line.startsWith('\t')) {
      const tl = [line]; i++;
      while (i < lines.length && lines[i].includes('|') && !lines[i].startsWith('    ')) { tl.push(lines[i]); i++; }
      const t = parseTable(tl);
      if (t) {
        html += '<div class="tbl-wrap"><table><thead><tr>';
        for (let c = 0; c < t.headers.length; c++) html += `<th style="text-align:${t.aligns[c]}">${renderInline(t.headers[c])}</th>`;
        html += '</tr></thead><tbody>';
        for (const row of t.rows) {
          html += '<tr>';
          for (let c = 0; c < row.length; c++) html += `<td style="text-align:${t.aligns[c]||'left'}">${renderInline(row[c])}</td>`;
          html += '</tr>';
        }
        html += '</tbody></table></div>'; continue;
      }
    }

    // Heading
    const hm = line.match(/^(#{1,3}) (.*)/);
    if (hm) { html += `<h${hm[1].length}>${renderInline(hm[2])}</h${hm[1].length}>`; i++; continue; }

    // HR
    if (/^[-*]{3,}\s*$/.test(line)) { html += '<hr>'; i++; continue; }

    // <details> block
    if (line.trim().startsWith('<details')) {
      let summary = '', body = [];
      const inl = line.match(/<summary>(.*?)<\/summary>/);
      if (inl) { summary = inl[1]; i++; }
      else { i++; while (i < lines.length) { const m = lines[i].match(/<summary>(.*?)<\/summary>/); if (m) { summary = m[1]; i++; break; } i++; } }
      while (i < lines.length && lines[i].trim() !== '</details>') { body.push(lines[i]); i++; }
      i++;
      html += `<details><summary>${esc(summary || 'Details')}</summary><div style="padding:0 12px 10px;border-top:1px solid var(--md-outline-var)">${renderMd(body.join('\n'))}</div></details>`;
      continue;
    }

    // [iframe-ai:N](url) Title — render as embedded iframe (same as [iframe])
    const iam = line.match(/^\[iframe-ai:\d+\]\s*\(([^\s)]+)\)\s*(.*)/);
    if (iam) {
      const url = iam[1], title = iam[2].trim() || 'Chart';
      if (/^https?:\/\//.test(url)) {
        html += `<div class="ie"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a><div class="ie-frame"><iframe src="${esc(url)}" title="${esc(title)}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" allowfullscreen></iframe></div></div>`;
      }
      i++; continue;
    }

    // [iframe](url) Title
    const ifm = line.match(/^\[iframe\]\s*\(([^\s)]+)\)\s*(.*)/);
    if (ifm) {
      const url = ifm[1], title = ifm[2].trim() || 'Embedded Content';
      if (/^https?:\/\//.test(url)) {
        html += `<div class="ie"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a><div class="ie-frame"><iframe src="${esc(url)}" title="${esc(title)}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" allowfullscreen></iframe></div></div>`;
      }
      i++; continue;
    }

    // Empty line
    if (line.trim() === '') { html += '<div class="sp"></div>'; i++; continue; }

    // Paragraph
    html += `<p>${renderInline(line)}</p>`; i++;
  }
  return html;
}

// ── DOM: message elements ────────────────────────────────────────
function scrollBottom() {
  const m = $('messages'); m.scrollTop = m.scrollHeight;
}

function updateClearBtn() {
  $('clear-btn').style.display = msgs.length > 0 ? 'flex' : 'none';
}

function addMsgEl(msg) {
  $('empty-state').style.display = 'none';
  const el = document.createElement('div');
  el.id = `m${msg.id}`;
  el.className = `msg ${msg.role}`;

  if (msg.role === 'user') {
    el.innerHTML = `<div class="msg-bubble">${esc(msg.content)}</div>`;
  } else {
    const bubble = document.createElement('div');
    bubble.id = `mb${msg.id}`;
    bubble.className = 'msg-bubble md';
    if (msg.streaming) {
      bubble.innerHTML = `<span id="mc${msg.id}"></span><span class="cursor" id="cur${msg.id}"></span>`;
    } else {
      bubble.innerHTML = renderMd(msg.content);
    }
    el.appendChild(bubble);
  }
  $('messages').appendChild(el);
  scrollBottom();
}

function updateStreamBubble(id) {
  const msg = msgs.find(m => m.id === id);
  if (!msg) return;
  const contentEl = $(`mc${id}`);
  if (contentEl) contentEl.innerHTML = renderMd(msg.content);
  scrollBottom();
}

function finalizeBubble(id) {
  const msg = msgs.find(m => m.id === id);
  if (!msg) return;
  msg.streaming = false;
  const cur = $(`cur${id}`);
  if (cur) cur.remove();
  const contentEl = $(`mc${id}`);
  if (contentEl) contentEl.innerHTML = renderMd(msg.content);
  scrollBottom();
}

// ── DOM: tool zones ───────────────────────────────────────────────
function buildToolStep(tc, key) {
  const el = document.createElement('div');
  el.id = `ts${key}`;
  el.className = 'tool-step';
  const isPending = tc.result === undefined;
  const isNav = tc.name.startsWith('navigate_superset_');
  const label = isPending ? tc.name.replace(/_/g, ' ')
    : isNav ? `↗ ${tc.name === 'navigate_superset_dashboard' ? `Dashboard ${tc.args?.dashboardId ?? ''}` : `Chart ${tc.args?.chartId ?? ''}`}`
    : `✓ ${tc.name.replace(/_/g, ' ')}`;
  el.innerHTML = `
    <button class="tool-step-header" onclick="toggleEl('tsb${key}',null,'tsc${key}')">
      ${isPending ? '<span class="spinner"></span>' : ''}
      <span>${esc(label)}</span>
      <span id="tsc${key}" style="font-size:11px;opacity:0.4;margin-left:auto;flex-shrink:0">▾</span>
    </button>
    <div id="tsb${key}" style="display:none" class="tool-step-body">${esc(`args: ${JSON.stringify(tc.args, null, 2)}`)}</div>`;
  return el;
}

function ensureToolZone(msgId) {
  const msg = msgs.find(m => m.id === msgId);
  if (!msg) return;
  let zone = $(`tz${msgId}`);
  if (zone) return;
  zone = document.createElement('div');
  zone.id = `tz${msgId}`;
  zone.className = 'tool-zone';
  const count = (msg.toolCalls || []).length;
  zone.innerHTML = `
    <button class="tool-zone-header" onclick="toggleEl('tzb${msgId}',null,'tztg${msgId}')">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="flex-shrink:0;opacity:0.75">
        <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
      </svg>
      <span id="tzlb${msgId}" style="flex:1">${esc(count)} tool${count !== 1 ? 's' : ''} running…</span>
      <span class="spinner" id="tzspin${msgId}" style="border-color:var(--md-on-primary-cont);opacity:0.55;width:10px;height:10px"></span>
      <span id="tztg${msgId}" style="font-size:11px;opacity:0.4;margin-left:4px;flex-shrink:0">▾</span>
    </button>
    <div id="tzb${msgId}" style="display:none" class="tool-zone-body"></div>`;
  const msgEl = $(`m${msgId}`);
  if (msgEl) msgEl.insertBefore(zone, msgEl.firstChild);
}

function addToolCallEl(msgId, tc, idx) {
  ensureToolZone(msgId);
  const body = $(`tzb${msgId}`);
  if (body) body.appendChild(buildToolStep(tc, `${msgId}_${idx}`));
  // Update label
  const msg = msgs.find(m => m.id === msgId);
  const lbl = $(`tzlb${msgId}`);
  if (lbl && msg) {
    const count = msg.toolCalls.length;
    lbl.textContent = `${count} tool${count !== 1 ? 's' : ''} running…`;
  }
}

function finalizeToolZone(msgId) {
  const msg = msgs.find(m => m.id === msgId);
  const lbl = $(`tzlb${msgId}`);
  const spin = $(`tzspin${msgId}`);
  if (lbl && msg) {
    const count = msg.toolCalls.length;
    lbl.textContent = `${count} tool${count !== 1 ? 's' : ''} used`;
  }
  if (spin) spin.remove();
}

function updateToolStepEl(msgId, toolName, result, idx) {
  const key = `${msgId}_${idx}`;
  const header = $(`ts${key}`)?.querySelector('.tool-step-header');
  const body   = $(`tsb${key}`);
  const tc = msgs.find(m => m.id === msgId)?.toolCalls[idx];
  if (!tc) return;
  const isNav = toolName.startsWith('navigate_superset_');
  const label = isNav
    ? `↗ ${toolName === 'navigate_superset_dashboard' ? `Dashboard ${tc.args?.dashboardId ?? ''}` : `Chart ${tc.args?.chartId ?? ''}`}`
    : `✓ ${toolName.replace(/_/g, ' ')}`;
  if (header) header.innerHTML = `<span>${esc(label)}</span><span id="tsc${key}" style="font-size:11px;opacity:0.4;margin-left:auto;flex-shrink:0">▾</span>`;
  if (body) body.textContent = `args: ${JSON.stringify(tc.args, null, 2)}\n\nresult: ${result}`;
}

function addFollowupEl(msgId, suggestions) {
  const msgEl = $(`m${msgId}`);
  if (!msgEl || !suggestions.length) return;
  const el = document.createElement('div');
  el.className = 'followup';
  el.innerHTML = '<div class="followup-label">Follow-up questions</div>';
  for (const s of suggestions) {
    const btn = document.createElement('button');
    btn.className = 'followup-btn';
    btn.innerHTML = `<span class="followup-arrow">→</span>${esc(s)}`;
    btn.addEventListener('click', () => sendSuggestion(s));
    el.appendChild(btn);
  }
  msgEl.appendChild(el);
  scrollBottom();
}

function toggleEl(bodyId, chevronId, toggleId) {
  const body = $(bodyId), ch = $(chevronId), tg = $(toggleId);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : (body.classList.contains('tool-zone-body') ? 'flex' : 'block');
  if (ch) ch.style.transform = open ? 'none' : 'rotate(90deg)';
  if (tg) tg.textContent = open ? '▾' : '▴';
}

// ── Banner ───────────────────────────────────────────────────────
function showBanner(text) { $('banner-text').textContent = text; $('banner').style.display = 'flex'; }
function hideBanner() { $('banner').style.display = 'none'; }

// ── Send / stream ────────────────────────────────────────────────
async function doSend(text, history) {
  loading = true;
  updateSendBtn();
  hideBanner();

  const aid = String(Date.now() + 1);
  streamId = aid;
  const asm = { id: aid, role: 'assistant', content: '', streaming: true, toolCalls: [] };
  msgs.push(asm);
  addMsgEl(asm);
  updateClearBtn();

  abortCtrl = new AbortController();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
      signal: abortCtrl.signal,
    });

    if (!res.ok || !res.body) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      asm.content = err.error ?? 'Error';
      finalizeBubble(aid);
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      if (abortCtrl.signal.aborted) { asm.content += '\n\n[Response interrupted]'; finalizeBubble(aid); break; }
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';

      for (const line of lines) {
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }

        if (ev.type === 'delta') {
          asm.content += ev.content ?? '';
          updateStreamBubble(aid);
        } else if (ev.type === 'tool_call') {
          const tc = { name: ev.name, args: ev.args ?? {}, result: undefined };
          asm.toolCalls.push(tc);
          addToolCallEl(aid, tc, asm.toolCalls.length - 1);
        } else if (ev.type === 'tool_result') {
          const idx = [...asm.toolCalls].reverse().findIndex(tc => tc.name === ev.name && tc.result === undefined);
          if (idx !== -1) {
            const realIdx = asm.toolCalls.length - 1 - idx;
            asm.toolCalls[realIdx].result = ev.result ?? '';
            updateToolStepEl(aid, ev.name, ev.result ?? '', realIdx);
          }
        } else if (ev.type === 'followup_suggestions') {
          const sugg = Array.isArray(ev.suggestions) ? ev.suggestions.filter(s => typeof s === 'string') : [];
          asm.followup = sugg;
          addFollowupEl(aid, sugg);
        } else if (ev.type === 'done') {
          finalizeBubble(aid);
          if (asm.toolCalls.length > 0) finalizeToolZone(aid);
        } else if (ev.type === 'error') {
          asm.content = asm.content || (ev.message ?? 'Error');
          finalizeBubble(aid);
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') { asm.content += '\n\n[Response interrupted]'; }
    else { asm.content = asm.content || (err.message ?? 'Network error'); }
    finalizeBubble(aid);
    if (asm.toolCalls.length > 0) finalizeToolZone(aid);
  } finally {
    loading = false; abortCtrl = null; streamId = null;
    updateSendBtn();
  }
}

function sendMessage(text) {
  if (!text || loading) return;
  const userMsg = { id: String(Date.now()), role: 'user', content: text };
  msgs.push(userMsg);
  addMsgEl(userMsg);
  updateClearBtn();
  const history = msgs.map(m => ({ role: m.role === 'tool' ? 'user' : m.role, content: m.content }));
  doSend(text, history);
}

function sendSuggestion(text) {
  if (loading) return;
  sendMessage(text);
}

// ── UI handlers ──────────────────────────────────────────────────
function onInput(ta) {
  $('input-wrap').classList.toggle('has-text', !!ta.value.trim());
  $('send-icon').style.opacity = ta.value.trim() ? '1' : '0.3';
  ta.style.height = 'auto';
  const maxH = 24 * 5;
  ta.style.height = Math.min(ta.scrollHeight, maxH) + 'px';
  ta.style.overflowY = ta.scrollHeight > maxH ? 'auto' : 'hidden';
}

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
}

function submit() {
  const ta = $('input');
  const text = ta.value.trim();
  if (!text || loading) return;
  ta.value = ''; ta.style.height = 'auto'; onInput(ta);
  sendMessage(text);
}

function onSendOrStop() {
  if (loading) { if (abortCtrl) abortCtrl.abort(); }
  else submit();
}

function updateSendBtn() {
  if (loading) {
    $('send-icon').style.display = 'none';
    $('stop-icon').style.display = 'block';
  } else {
    $('stop-icon').style.display = 'none';
    $('send-icon').style.display = 'block';
    $('send-icon').style.opacity = $('input').value.trim() ? '1' : '0.3';
  }
}

function clearChat() {
  msgs = [];
  $('messages').innerHTML = `
    <div id="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;opacity:0.45;user-select:none;font-size:13px;pointer-events:none">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="var(--md-primary)">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
      </svg>
      <span>Hello! Ask me anything about your data.</span>
    </div>`;
  updateClearBtn();
}

// ── Init ─────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('/api/chat');
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      showBanner(body.error ?? `Chat API unavailable (HTTP ${res.status})`);
    } else if (body.mcpWarning) {
      $('mcp-warning-text').textContent = body.mcpWarning;
      $('mcp-warning').style.display = 'flex';
    }
  } catch { /* silent — user will see an error when they try to send */ }
})();
</script>
</body>
