services:
  caddy:
    build: ./Caddy
    image: localhost/hyperset-caddy:latest
    container_name: hyperset-caddy
    ports:
      - "443:443"
      - "80:80"
    environment:
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - AUTH_CRYPTO_KEY=${AUTH_CRYPTO_KEY}
      - SUPERSET_UPSTREAM=${SUPERSET_UPSTREAM:-http://hyperset-superset:8088}
    env_file:
      - ./.env
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:Z
      - ./Caddy/users.json:/data/users.json:Z
      - ./Caddy/bridge.js:/Caddy/bridge.js:Z
      - ./theme.json:/Caddy/theme.json:Z
      - ./logos:/Caddy/logos:Z
      - caddy_data:/data/caddy
      - caddy_config:/config
    networks:
      - hyperset-net
    restart: unless-stopped

  pages:
    build: ./Pages-Service
    image: localhost/hyperset-pages:latest
    container_name: hyperset-pages
    environment:
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
    volumes:
      - ./Pages:/pages:Z
    networks:
      - hyperset-net
    restart: unless-stopped

  superset-mcp:
    build: ./Superset-MCP
    image: localhost/hyperset-superset-mcp:latest
    container_name: hyperset-superset-mcp
    environment:
      - MCP_SERVICE_SECRET=${MCP_SERVICE_SECRET}
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - HYPERSET_PORTAL_URL=${HYPERSET_PORTAL_URL:-https://pages.${HYPERSET_DOMAIN}}
      - SUPERSET_UPSTREAM=${SUPERSET_UPSTREAM:-http://hyperset-superset:8088}
      - SUPERSET_PUBLIC_URL=${SUPERSET_PUBLIC_URL:-https://superset.${HYPERSET_DOMAIN}}
      - SUPERSET_MCP_USER=${SUPERSET_MCP_USER}
      - SUPERSET_MCP_PASSWORD=${SUPERSET_MCP_PASSWORD}
    env_file:
      - ./.env
    networks:
      - hyperset-net
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: ./portal-app/Dockerfile
      shm_size: "256m"
    image: localhost/hyperset-portal:latest
    container_name: hyperset-portal
    environment:
      - MCP_SERVICE_SECRET=${MCP_SERVICE_SECRET}
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - SUPERSET_PUBLIC_URL=${SUPERSET_PUBLIC_URL:-https://superset.${HYPERSET_DOMAIN}}
      - PAGES_PUBLIC_URL=${PAGES_PUBLIC_URL:-https://pages.${HYPERSET_DOMAIN}}
      - PAGES_DIR=/app/pages
      - SUPERSET_MCP_URL=http://hyperset-superset-mcp:8000/mcp
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    volumes:
      - ./theme.json:/app/theme.json:Z
      - ./Pages:/app/pages:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hyperset-net
    restart: unless-stopped

  superset-db:
    image: docker.io/library/postgres:15-alpine
    container_name: hyperset-superset-db
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - POSTGRES_DB=superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset-redis:
    image: docker.io/library/redis:7-alpine
    container_name: hyperset-superset-redis
    volumes:
      - superset_redis_data:/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  superset-app:
    build:
      context: ./Superset-Instance
      dockerfile: Dockerfile
    image: localhost/hyperset-superset:latest
    container_name: hyperset-superset
    environment:
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - DATABASE_HOST=hyperset-superset-db
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DB_HOST=hyperset-superset-db
      - DB_PORT=5432
      - DB_NAME=superset
      - DB_USER=superset
      - DB_PASS=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - EXAMPLES_USER=superset
      - EXAMPLES_PASSWORD=superset
      - EXAMPLES_HOST=hyperset-superset-db
      - EXAMPLES_PORT=5432
      - EXAMPLES_DB=superset
      - REDIS_HOST=hyperset-superset-redis
      - REDIS_PORT=6379
      - REDIS_CELERY_DB=0
      - REDIS_RESULTS_DB=1
      - SECRET_KEY=${SUPERSET_SECRET_KEY:-CHANGE_ME_RUN_openssl_rand_base64_42}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config_docker.py
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - HYPERSET_ORIGIN=https://${HYPERSET_DOMAIN}
      - HYPERSET_ADMIN_ROLE_HEADER=hyperset/admin
      - HYPERSET_USER_ROLE_HEADER=hyperset/user
      - SUPERSET_PORT=8088
      - SUPERSET_APP_ROOT=/
      - SUPERSET_LOG_LEVEL=INFO
    env_file:
      - ./.env
    volumes:
      - ./Superset-Instance/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:Z
      - ./theme.json:/app/pythonpath/theme.json:Z
      - ./logos/hyperset-logo.png:/app/superset/static/assets/images/superset-logo-horiz.png:Z
      - superset_home:/app/superset_home
    networks:
      - hyperset-net
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  superset-worker:
    build:
      context: ./Superset-Instance
      dockerfile: Dockerfile
    image: localhost/hyperset-superset:latest
    container_name: hyperset-superset-worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "-l", "INFO"]
    environment:
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - DATABASE_HOST=hyperset-superset-db
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DB_HOST=hyperset-superset-db
      - DB_PORT=5432
      - DB_NAME=superset
      - DB_USER=superset
      - DB_PASS=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - REDIS_HOST=hyperset-superset-redis
      - REDIS_PORT=6379
      - REDIS_CELERY_DB=0
      - REDIS_RESULTS_DB=1
      - SECRET_KEY=${SUPERSET_SECRET_KEY:-CHANGE_ME_RUN_openssl_rand_base64_42}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config_docker.py
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - HYPERSET_ORIGIN=https://${HYPERSET_DOMAIN}
      - HYPERSET_ADMIN_ROLE_HEADER=hyperset/admin
      - HYPERSET_USER_ROLE_HEADER=hyperset/user
      - CELERYD_CONCURRENCY=2
    env_file:
      - ./.env
    volumes:
      - ./Superset-Instance/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:Z
      - superset_home:/app/superset_home
    networks:
      - hyperset-net
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  superset-beat:
    build:
      context: ./Superset-Instance
      dockerfile: Dockerfile
    image: localhost/hyperset-superset:latest
    container_name: hyperset-superset-beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "-l", "INFO"]
    environment:
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - DATABASE_HOST=hyperset-superset-db
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DB_HOST=hyperset-superset-db
      - DB_PORT=5432
      - DB_NAME=superset
      - DB_USER=superset
      - DB_PASS=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - REDIS_HOST=hyperset-superset-redis
      - REDIS_PORT=6379
      - REDIS_CELERY_DB=0
      - REDIS_RESULTS_DB=1
      - SECRET_KEY=${SUPERSET_SECRET_KEY:-CHANGE_ME_RUN_openssl_rand_base64_42}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config_docker.py
      - HYPERSET_DOMAIN=${HYPERSET_DOMAIN}
      - HYPERSET_ORIGIN=https://${HYPERSET_DOMAIN}
      - HYPERSET_ADMIN_ROLE_HEADER=hyperset/admin
      - HYPERSET_USER_ROLE_HEADER=hyperset/user
    env_file:
      - ./.env
    volumes:
      - ./Superset-Instance/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:Z
      - superset_home:/app/superset_home
    networks:
      - hyperset-net
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    restart: unless-stopped

  superset-init:
    build:
      context: ./Superset-Instance
      dockerfile: Dockerfile
    image: localhost/hyperset-superset:latest
    container_name: hyperset-superset-init
    command: >
      bash -c "
        echo 'Waiting for database...' &&
        sleep 15 &&
        echo 'Running database upgrade...' &&
        superset db upgrade &&
      echo 'Creating admin user...' &&
        superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@hyperset.local \
          --password ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD must be set in .env} || echo 'Admin user may already exist' &&
        echo 'Initializing Superset...' &&
        superset init &&
        echo 'Loading examples (this may take 2-3 minutes)...' &&
        timeout 300 superset load_examples || echo 'Examples loading completed or timed out' &&
        echo 'Superset initialization complete'
      "
    environment:
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - DATABASE_HOST=hyperset-superset-db
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DB_HOST=hyperset-superset-db
      - DB_PORT=5432
      - DB_NAME=superset
      - DB_USER=superset
      - DB_PASS=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - REDIS_HOST=hyperset-superset-redis
      - REDIS_PORT=6379
      - REDIS_CELERY_DB=0
      - REDIS_RESULTS_DB=1
      - SECRET_KEY=${SUPERSET_SECRET_KEY:-CHANGE_ME_RUN_openssl_rand_base64_42}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config_docker.py
    env_file:
      - ./.env
    volumes:
      - ./Superset-Instance/superset_config_docker.py:/app/pythonpath/superset_config_docker.py:Z
      - superset_home:/app/superset_home
    networks:
      - hyperset-net
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  superset_db_data:
  superset_redis_data:
  superset_home:

networks:
  hyperset-net:
    external: true
