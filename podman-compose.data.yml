# podman-compose.data.yml
# Centralised stateful services — run this alongside the other compose files.
# All portal instances and Superset services share these backends, making the
# rest of the stack fully stateless and horizontally scalable.
#
# Volume layout:
#   portal_db_data   — portal PostgreSQL data
#   superset_db_data — Superset PostgreSQL data
#   superset_redis_data — Redis AOF / RDB snapshots
#   hyperset_data    — all file-based state under /hyperset/:
#     /hyperset/pages/        static pages content
#     /hyperset/superset-home/ Superset home dir (celerybeat schedule, etc.)
#     /hyperset/caddy-data/   Caddy TLS certificates (XDG_DATA_HOME)
#     /hyperset/caddy-config/ Caddy config cache (XDG_CONFIG_HOME)
#
# Start order:
#   podman-compose -f podman-compose.data.yml -f podman-compose.yml up -d

services:
  # ── Portal application database ──────────────────────────────────────────
  # Stores admin settings, page settings, and knowledge-base documents.
  portal-db:
    image: docker.io/pgvector/pgvector:pg15
    container_name: hyperset-portal-db
    environment:
      - POSTGRES_USER=portal
      - POSTGRES_PASSWORD=${PORTAL_DATABASE_PASSWORD:?PORTAL_DATABASE_PASSWORD must be set in .env}
      - POSTGRES_DB=portal
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Superset metadata database ────────────────────────────────────────────
  superset-db:
    image: docker.io/library/postgres:15-alpine
    container_name: hyperset-superset-db
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - POSTGRES_DB=superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Superset cache / Celery broker ───────────────────────────────────────
  superset-redis:
    image: docker.io/library/redis:7-alpine
    container_name: hyperset-superset-redis
    volumes:
      - superset_redis_data:/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Shared pages volume initializer ───────────────────────────────────────
  # Copies any existing pages from ./Pages into the shared volume on first run.
  # This service exits immediately after initialization.
  pages-volume-init:
    image: docker.io/library/busybox:latest
    container_name: hyperset-pages-volume-init
    volumes:
      - hyperset_data:/hyperset
      - ./Pages:/source/pages:ro,Z
    command: >
      sh -c "
        mkdir -p /hyperset/pages &&
        chmod 755 /hyperset/pages &&
        if [ -d /source/pages ] && [ \"\$(ls -A /source/pages)\" ]; then
          echo 'Copying existing pages from ./Pages to shared volume...' &&
          cp -r /source/pages/* /hyperset/pages/ &&
          echo 'Copied pages:' &&
          ls -la /hyperset/pages/;
        else
          echo 'No existing pages found in ./Pages';
        fi &&
        echo 'Pages volume initialized'"
    restart: "no"

volumes:
  portal_db_data:
  superset_db_data:
  superset_redis_data:
  hyperset_data:

networks:
  hyperset-net:
    external: true
