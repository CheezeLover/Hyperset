# podman-compose.data.yml
# Centralised stateful services — run this alongside the other compose files.
# All portal instances and Superset services share these backends, making the
# rest of the stack fully stateless and horizontally scalable.
#
# Volume layout:
#   superset_db_data    — single PostgreSQL 15 (pgvector) instance
#                         • superset database  — Superset metadata
#                         • portal schema      — portal admin settings, pages, knowledge base
#   superset_redis_data — Redis AOF / RDB snapshots
#   hyperset_data       — all file-based state under /hyperset/:
#     /hyperset/pages/        static pages content
#     /hyperset/superset-home/ Superset home dir (celerybeat schedule, etc.)
#     /hyperset/caddy-data/   Caddy TLS certificates (XDG_DATA_HOME)
#     /hyperset/caddy-config/ Caddy config cache (XDG_CONFIG_HOME)
#
# Start order:
#   podman-compose -f podman-compose.data.yml -f podman-compose.yml up -d

services:
  # ── Superset metadata database + portal schema ───────────────────────────
  # Single PostgreSQL 15 instance (pgvector image) that hosts:
  #   • superset database  — Superset metadata tables
  #   • portal schema      — portal app tables (admin settings, pages, knowledge base)
  #
  # The init-portal-schema.sh script (docker-entrypoint-initdb.d) creates
  # the 'portal' role and schema on first boot.  It only runs once (when the
  # data volume is empty); existing deployments must run it manually:
  #
  #   podman exec hyperset-superset-db \
  #     psql -U superset -d superset \
  #     -f /docker-entrypoint-initdb.d/init-portal-schema.sh
  superset-db:
    image: docker.io/pgvector/pgvector:pg15
    container_name: hyperset-superset-db
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      - POSTGRES_DB=superset
      # Forwarded so the init script can set the portal role password
      - PORTAL_DATABASE_PASSWORD=${PORTAL_DATABASE_PASSWORD:?PORTAL_DATABASE_PASSWORD must be set in .env}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
      - ./Superset-Instance/init-portal-schema.sh:/docker-entrypoint-initdb.d/init-portal-schema.sh:ro,Z
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Superset cache / Celery broker ───────────────────────────────────────
  superset-redis:
    image: docker.io/library/redis:7-alpine
    container_name: hyperset-superset-redis
    volumes:
      - superset_redis_data:/data
    networks:
      - hyperset-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Shared volume initializer ─────────────────────────────────────────────
  # Runs as root (busybox default) to pre-create all hyperset_data subfolders
  # with open permissions so unprivileged service containers can write to them.
  # Also seeds pages from ./Pages on first run. Exits immediately after.
  pages-volume-init:
    image: docker.io/library/busybox:latest
    container_name: hyperset-pages-volume-init
    volumes:
      - hyperset_data:/hyperset
      - ./Pages:/source/pages:ro,Z
    command: >
      sh -c "
        if [ -f /hyperset/.initialized ]; then
          echo 'Volume already initialized, skipping';
          exit 0;
        fi &&
        echo 'Creating hyperset_data subfolders...' &&
        mkdir -p /hyperset/pages /hyperset/superset-home /hyperset/caddy-data /hyperset/caddy-config &&
        chmod 777 /hyperset/pages /hyperset/superset-home /hyperset/caddy-data /hyperset/caddy-config &&
        if [ -d /source/pages ] && [ \"\$(ls -A /source/pages)\" ]; then
          echo 'Copying existing pages from ./Pages to shared volume...' &&
          cp -r /source/pages/* /hyperset/pages/ &&
          echo 'Copied pages:' &&
          ls -la /hyperset/pages/;
        else
          echo 'No existing pages found in ./Pages';
        fi &&
        touch /hyperset/.initialized &&
        echo 'Volume initialized'"
    restart: "no"

volumes:
  superset_db_data:
  superset_redis_data:
  hyperset_data:

networks:
  hyperset-net:
    external: true
